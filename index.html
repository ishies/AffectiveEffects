<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Puter App</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 16px; }
        #chat { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .bubble { padding: 10px 14px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; line-height: 1.4; }
        .bubble.assistant { background: #f1f1f1; align-self: flex-start; }
        .bubble.user { background: #d6e8ff; align-self: flex-end; }
        .bubble.status { background: none; color: #888; font-style: italic; align-self: center; }
        #inputRow { display: flex; gap: 8px; }
        #message { flex: 1; padding: 8px; }
    </style>
</head>

<body>
    <h1>My Puter App</h1>

    <!-- Populated from the iframe's URL query params (Qualtrics piped text) -->
    <input id="earnedAmount" type="hidden">
    <input id="initialSavings" type="hidden">
    <input id="initialEntertainment" type="hidden">

    <div id="chat"></div>

    <div id="inputRow">
        <input id="message" type="text" placeholder="Type your reply..." disabled>
        <button id="askButton" disabled>Send</button>
    </div>

    <script>
        const WORKER_URL = "https://bright-table-566379.puter.work/api/ai";
        const sessionId = crypto.randomUUID();

        const chat = document.getElementById("chat");
        const messageInput = document.getElementById("message");
        const askButton = document.getElementById("askButton");

        const earnedAmountInput = document.getElementById("earnedAmount");
        const initialSavingsInput = document.getElementById("initialSavings");
        const initialEntertainmentInput = document.getElementById("initialEntertainment");

        const params = new URLSearchParams(window.location.search);
        earnedAmountInput.value = params.get("earnedAmount") ?? "";
        initialSavingsInput.value = params.get("initialSavings") ?? "";
        initialEntertainmentInput.value = params.get("initialEntertainment") ?? "";

        function addBubble(text, role) {
            const div = document.createElement("div");
            div.className = "bubble " + role;
            div.textContent = text;
            chat.appendChild(div);
            return div;
        }

        function setInputEnabled(enabled) {
            messageInput.disabled = !enabled;
            askButton.disabled = !enabled;
        }

        async function callWorker(payload) {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || "AI request failed.");
            }
            return data?.message?.content?.[0]?.text || JSON.stringify(data, null, 2);
        }

        async function startConversation() {
            const earnedAmount = Number(earnedAmountInput.value);
            const initialSavings = Number(initialSavingsInput.value);
            const initialEntertainment = Number(initialEntertainmentInput.value);

            if (
                Number.isNaN(earnedAmount) ||
                Number.isNaN(initialSavings) ||
                Number.isNaN(initialEntertainment)
            ) {
                addBubble("Missing required session data. Please reload the survey page.", "status");
                return;
            }

            const statusBubble = addBubble("Thinking...", "status");

            try {
                const text = await callWorker({
                    start: true,
                    earnedAmount,
                    initialSavings,
                    initialEntertainment,
                    sessionId
                });
                statusBubble.remove();
                addBubble(text, "assistant");
                setInputEnabled(true);
                messageInput.focus();
            } catch (error) {
                console.error(error);
                statusBubble.textContent = "Error: " + error.message;
            }
        }

        async function sendReply() {
            const message = messageInput.value.trim();
            if (!message) return;

            addBubble(message, "user");
            messageInput.value = "";
            setInputEnabled(false);

            const statusBubble = addBubble("Thinking...", "status");

            try {
                const text = await callWorker({
                    message,
                    earnedAmount: Number(earnedAmountInput.value),
                    initialSavings: Number(initialSavingsInput.value),
                    initialEntertainment: Number(initialEntertainmentInput.value),
                    sessionId
                });
                statusBubble.remove();
                addBubble(text, "assistant");
            } catch (error) {
                console.error(error);
                statusBubble.textContent = "Error: " + error.message;
            } finally {
                setInputEnabled(true);
                messageInput.focus();
            }
        }

        askButton.addEventListener("click", sendReply);
        messageInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") sendReply();
        });

        startConversation();
    </script>
</body>
</html>
