<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Advising Session</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1F2A37;
            --ink-soft: #5B6675;
            --paper: #FAF7F2;
            --paper-raised: #FFFFFF;
            --line: #E4DFD5;
            --sage: #6B8F7C;
            --sage-dark: #4C6B5B;
            --sage-tint: #E8EFEA;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background: var(--paper);
            max-width: 560px;
            margin: 0 auto;
            padding: 28px 20px 20px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 18px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--sage);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 17px;
            flex-shrink: 0;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 19px;
            margin: 0;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 13px;
            color: var(--ink-soft);
            margin-top: 2px;
        }

        #chat {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 18px;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .row.user { justify-content: flex-end; }

        .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            max-width: 78%;
            white-space: pre-wrap;
            line-height: 1.55;
            font-size: 14.5px;
            animation: rise 0.25s ease-out;
        }

        .bubble.assistant {
            background: var(--paper-raised);
            border: 1px solid var(--line);
            border-bottom-left-radius: 4px;
        }

        .bubble.user {
            background: var(--sage);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .row.status {
            justify-content: flex-start;
            padding-left: 50px;
        }

        .status-text {
            color: var(--ink-soft);
            font-size: 13px;
            font-style: italic;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #inputRow {
            display: flex;
            gap: 8px;
            position: sticky;
            bottom: 0;
            background: var(--paper);
            padding-top: 8px;
        }

        #message {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--paper-raised);
            font-family: inherit;
            font-size: 14.5px;
            color: var(--ink);
        }

        #message:focus {
            outline: none;
            border-color: var(--sage);
        }

        #message:disabled { color: var(--ink-soft); }

        #askButton {
            padding: 0 20px;
            border: none;
            border-radius: 10px;
            background: var(--sage);
            color: #fff;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        #askButton:hover:not(:disabled) { background: var(--sage-dark); }
        #askButton:disabled { background: var(--line); color: var(--ink-soft); cursor: default; }
        #askButton:focus-visible, #message:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }

        #app { display: none; }

        #loadingScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            min-height: 260px;
            color: var(--ink-soft);
            font-size: 14px;
        }

        #spinner {
            width: 26px;
            height: 26px;
            border: 3px solid var(--sage-tint);
            border-top-color: var(--sage);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            .bubble { animation: none; }
            #spinner { animation-duration: 1.6s; }
        }
    </style>
</head>

<body>
    <header>
        <div class="avatar">A</div>
        <div>
            <h1>Your Financial Advisor</h1>
            <div class="subtitle">One-on-one session</div>
        </div>
    </header>

    <!-- Populated from the iframe's URL query params (Qualtrics piped text) -->
    <input id="earnedAmount" type="hidden">
    <input id="initialSavings" type="hidden">
    <input id="initialEntertainment" type="hidden">

    <div id="loadingScreen">
        <div id="spinner"></div>
        <div>Connecting you with your advisor...</div>
    </div>

    <div id="app">
        <div id="chat"></div>

        <div id="inputRow">
            <input id="message" type="text" placeholder="Type your reply..." disabled>
            <button id="askButton" disabled>Send</button>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://bright-table-566379.puter.work/api/ai";
        const sessionId = crypto.randomUUID();

        const loadingScreen = document.getElementById("loadingScreen");
        const app = document.getElementById("app");
        const chat = document.getElementById("chat");
        const messageInput = document.getElementById("message");
        const askButton = document.getElementById("askButton");

        const earnedAmountInput = document.getElementById("earnedAmount");
        const initialSavingsInput = document.getElementById("initialSavings");
        const initialEntertainmentInput = document.getElementById("initialEntertainment");

        function parseAmount(raw) {
            if (raw == null) return NaN;
            // Strip anything that isn't a digit, minus sign, or decimal point
            // (handles "3,150", "$3,150", "3150 ", etc.)
            const cleaned = raw.replace(/[^0-9.-]/g, "");
            return cleaned === "" ? NaN : Number(cleaned);
        }

        const params = new URLSearchParams(window.location.search);
        earnedAmountInput.value = params.get("earnedAmount") ?? "";
        initialSavingsInput.value = params.get("initialSavings") ?? "";
        initialEntertainmentInput.value = params.get("initialEntertainment") ?? "";

        function addBubble(text, role) {
            const row = document.createElement("div");
            row.className = "row " + role;

            if (role === "assistant") {
                const avatar = document.createElement("div");
                avatar.className = "avatar";
                avatar.style.width = "32px";
                avatar.style.height = "32px";
                avatar.style.fontSize = "14px";
                avatar.textContent = "A";
                row.appendChild(avatar);
            }

            const div = document.createElement("div");
            div.className = "bubble " + role;
            div.textContent = text;
            row.appendChild(div);

            chat.appendChild(row);
            return div;
        }

        function addStatus(text) {
            const row = document.createElement("div");
            row.className = "row status";
            const span = document.createElement("div");
            span.className = "status-text";
            span.textContent = text;
            row.appendChild(span);
            chat.appendChild(row);
            return span;
        }

        function setInputEnabled(enabled) {
            messageInput.disabled = !enabled;
            askButton.disabled = !enabled;
        }

        async function callWorker(payload) {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || "AI request failed.");
            }
            if (data.meta) {
                // Forward condition/PA/allocation data to the parent Qualtrics page,
                // which listens for this and saves it as embedded data on the response.
                window.parent.postMessage({ type: "advisorSessionMeta", meta: data.meta }, "*");
            }
            return data?.message?.content?.[0]?.text || JSON.stringify(data, null, 2);
        }

        async function startConversation() {
            const earnedAmount = parseAmount(earnedAmountInput.value);
            const initialSavings = parseAmount(initialSavingsInput.value);
            const initialEntertainment = parseAmount(initialEntertainmentInput.value);

            const missing = [];
            if (Number.isNaN(earnedAmount)) missing.push(`earnedAmount ("${earnedAmountInput.value}")`);
            if (Number.isNaN(initialSavings)) missing.push(`initialSavings ("${initialSavingsInput.value}")`);
            if (Number.isNaN(initialEntertainment)) missing.push(`initialEntertainment ("${initialEntertainmentInput.value}")`);

            if (missing.length > 0) {
                loadingScreen.innerHTML =
                    "Missing or invalid session data: " + missing.join(", ") +
                    ". Please reload the survey page, or contact the study administrator if this persists.";
                return;
            }

            try {
                const text = await callWorker({
                    start: true,
                    earnedAmount,
                    initialSavings,
                    initialEntertainment,
                    sessionId
                });
                loadingScreen.style.display = "none";
                app.style.display = "block";
                addBubble(text, "assistant");
                setInputEnabled(true);
                messageInput.focus();
            } catch (error) {
                console.error(error);
                loadingScreen.innerHTML = "Error: " + error.message;
            }
        }

        async function sendReply() {
            const message = messageInput.value.trim();
            if (!message) return;

            addBubble(message, "user");
            messageInput.value = "";
            setInputEnabled(false);

            const status = addStatus("Advisor is typing...");

            try {
                const text = await callWorker({
                    message,
                    earnedAmount: parseAmount(earnedAmountInput.value),
                    initialSavings: parseAmount(initialSavingsInput.value),
                    initialEntertainment: parseAmount(initialEntertainmentInput.value),
                    sessionId
                });
                status.parentElement.remove();
                addBubble(text, "assistant");
            } catch (error) {
                console.error(error);
                status.textContent = "Error: " + error.message;
            } finally {
                setInputEnabled(true);
                messageInput.focus();
            }
        }

        askButton.addEventListener("click", sendReply);
        messageInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") sendReply();
        });

        startConversation();
    </script>
</body>
</html>
