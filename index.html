<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Puter App</title>
</head>

<body>
    <h1>My Puter App</h1>

    <!-- These are populated automatically from the iframe's URL query params
         (set by Qualtrics piped text) — not meant to be edited by the participant. -->
    <input id="earnedAmount" type="hidden">
    <input id="initialSavings" type="hidden">
    <input id="initialEntertainment" type="hidden">

    <input
        id="message"
        type="text"
        placeholder="Ask something..."
    >

    <button id="askButton">Ask AI</button>

    <pre id="answer"></pre>

    <script>
        const WORKER_URL = "https://bright-table-566379.puter.work/api/ai";

        // One session ID per page load, kept for the whole conversation
        // so the worker resolves the RecChange condition and PA Score
        // once and reuses them for all follow-up messages.
        const sessionId = crypto.randomUUID();

        const messageInput = document.getElementById("message");
        const askButton = document.getElementById("askButton");
        const answer = document.getElementById("answer");

        const earnedAmountInput = document.getElementById("earnedAmount");
        const initialSavingsInput = document.getElementById("initialSavings");
        const initialEntertainmentInput = document.getElementById("initialEntertainment");

        // Pull values passed in from Qualtrics via the iframe's URL query params
        // e.g. https://your-subdomain.puter.site/?earnedAmount=2000&initialSavings=300&initialEntertainment=150
        const params = new URLSearchParams(window.location.search);
        earnedAmountInput.value = params.get("earnedAmount") ?? "";
        initialSavingsInput.value = params.get("initialSavings") ?? "";
        initialEntertainmentInput.value = params.get("initialEntertainment") ?? "";

        async function askAI() {
            const message = messageInput.value.trim();

            if (!message) {
                answer.textContent = "Please enter a message.";
                return;
            }

            const earnedAmount = Number(earnedAmountInput.value);
            const initialSavings = Number(initialSavingsInput.value);
            const initialEntertainment = Number(initialEntertainmentInput.value);

            if (
                Number.isNaN(earnedAmount) ||
                Number.isNaN(initialSavings) ||
                Number.isNaN(initialEntertainment)
            ) {
                answer.textContent = "Missing required session data. Please reload the survey page.";
                return;
            }

            askButton.disabled = true;
            answer.textContent = "Thinking...";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message,
                        earnedAmount,
                        initialSavings,
                        initialEntertainment,
                        sessionId
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "AI request failed.");
                }

                answer.textContent =
                    data.message?.content?.[0]?.text ||
                    JSON.stringify(data, null, 2);

            } catch (error) {
                console.error(error);
                answer.textContent = "Error: " + error.message;
            } finally {
                askButton.disabled = false;
            }
        }

        askButton.addEventListener("click", askAI);

        messageInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                askAI();
            }
        });
    </script>
</body>
</html>
