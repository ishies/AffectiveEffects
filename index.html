<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Puter App</title>
</head>

<body>
    <h1>My Puter App</h1>

    <div>
        <label for="earnedAmount">Earned Amount ($)</label><br>
        <input id="earnedAmount" type="number" value="2000">
    </div>

    <div>
        <label for="initialSavings">Initial Savings Amount ($)</label><br>
        <input id="initialSavings" type="number" value="300">
    </div>

    <div>
        <label for="initialEntertainment">Initial Entertainment Amount ($)</label><br>
        <input id="initialEntertainment" type="number" value="150">
    </div>

    <hr>

    <input
        id="message"
        type="text"
        placeholder="Ask something..."
    >

    <button id="askButton">Ask AI</button>

    <pre id="answer"></pre>

    <script>
        const WORKER_URL = "https://bright-table-566379.puter.work/api/ai";

        // One session ID per page load, kept for the whole conversation
        // so the worker resolves the RecChange condition and PA Score
        // once and reuses them for all follow-up messages.
        const sessionId = crypto.randomUUID();

        const messageInput = document.getElementById("message");
        const askButton = document.getElementById("askButton");
        const answer = document.getElementById("answer");

        const earnedAmountInput = document.getElementById("earnedAmount");
        const initialSavingsInput = document.getElementById("initialSavings");
        const initialEntertainmentInput = document.getElementById("initialEntertainment");

        async function askAI() {
            const message = messageInput.value.trim();

            if (!message) {
                answer.textContent = "Please enter a message.";
                return;
            }

            const earnedAmount = Number(earnedAmountInput.value);
            const initialSavings = Number(initialSavingsInput.value);
            const initialEntertainment = Number(initialEntertainmentInput.value);

            if (
                Number.isNaN(earnedAmount) ||
                Number.isNaN(initialSavings) ||
                Number.isNaN(initialEntertainment)
            ) {
                answer.textContent = "Please enter valid numbers for all amount fields.";
                return;
            }

            askButton.disabled = true;
            answer.textContent = "Thinking...";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message,
                        earnedAmount,
                        initialSavings,
                        initialEntertainment,
                        sessionId
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "AI request failed.");
                }

                answer.textContent =
                    data.message?.content?.[0]?.text ||
                    JSON.stringify(data, null, 2);

            } catch (error) {
                console.error(error);
                answer.textContent = "Error: " + error.message;
            } finally {
                askButton.disabled = false;
            }
        }

        askButton.addEventListener("click", askAI);

        messageInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                askAI();
            }
        });
    </script>
</body>
</html>
